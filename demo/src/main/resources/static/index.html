<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API de Endereços</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <h1 class="text-center mb-4">
                <i class="bi bi-geo-alt-fill"></i> API de Endereços
            </h1>

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <div id="mensagemContainer"></div>

                    <form id="enderecoForm" novalidate>
                        <div class="mb-3">
                            <label for="cep" class="form-label fw-bold">CEP</label>
                            <input type="text" class="form-control" id="cep" placeholder="Ex: 74805300" maxlength="8" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-8 mb-3 mb-md-0">
                                <label for="rua" class="form-label fw-bold">Rua</label>
                                <input type="text" class="form-control" id="rua" placeholder="Nome da rua">
                            </div>
                            <div class="col-md-4">
                                <label for="bairro" class="form-label fw-bold">Bairro</label>
                                <input type="text" class="form-control" id="bairro" placeholder="Bairro">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="cidade" class="form-label fw-bold">Cidade</label>
                            <input type="text" class="form-control" id="cidade" placeholder="Cidade">
                        </div>

                        <div class="d-flex flex-wrap gap-2 justify-content-center">
                            <button type="button" id="btnBuscar" class="btn btn-primary">
                                <i class="bi bi-search"></i> Buscar pelo CEP
                            </button>
                            <button type="button" id="btnCriar" class="btn btn-success">
                                <i class="bi bi-plus-circle"></i> Criar Novo
                            </button>
                            <button type="button" id="btnApagar" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Apagar pelo CEP
                            </button>
                            <button type="button" id="btnListar" class="btn btn-info text-white">
                                <i class="bi bi-list-ul"></i> Listar Todos
                            </button>
                        </div>
                    </form>

                    <div id="resultadoContainer" class="mt-4"></div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
